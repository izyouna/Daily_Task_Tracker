version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: daily_task_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: daily_task_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_task_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
